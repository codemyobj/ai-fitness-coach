<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 教练页 · 新样式预览</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#1e293b; display:flex; justify-content:center; align-items:center; min-height:100vh; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif; padding:24px; }
  .phone { width:375px; height:720px; background:#f5f6f8; border-radius:44px; overflow:hidden; box-shadow:0 24px 80px rgba(0,0,0,.5); display:flex; flex-direction:column; position:relative; }
  .statusbar { background:linear-gradient(135deg,#111827 0%,#1f2937 60%,#059669 130%); color:#fff; font-size:12px; display:flex; justify-content:space-between; padding:10px 24px 0; }
  .hero { background:linear-gradient(135deg,#111827 0%,#1f2937 60%,#059669 130%); color:#fff; padding:8px 20px 26px; border-radius:0 0 20px 20px; }
  .hero-row { display:flex; align-items:center; }
  .hero-avatar { width:52px; height:52px; border-radius:16px; background:linear-gradient(135deg,#10b981,#059669); display:flex; align-items:center; justify-content:center; font-size:26px; box-shadow:0 4px 14px rgba(16,185,129,.4); }
  .hero-info { margin-left:14px; }
  .hero-name { font-size:19px; font-weight:700; letter-spacing:1px; }
  .hero-status { display:flex; align-items:center; margin-top:4px; font-size:12px; opacity:.85; }
  .status-dot { width:6px; height:6px; border-radius:50%; background:#34d399; margin-right:6px; box-shadow:0 0 5px rgba(52,211,153,.9); }
  .msg-list { flex:1; padding:16px 12px 0; overflow:hidden; background:linear-gradient(180deg,#eefbf4 0%,#f5f6f8 170px); }
  .msg-row { display:flex; margin-bottom:16px; align-items:flex-start; }
  .msg-row.user { justify-content:flex-end; }
  .avatar { min-width:38px; height:38px; border-radius:13px; background:linear-gradient(135deg,#10b981,#059669); color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; flex-shrink:0; box-shadow:0 2px 7px rgba(16,185,129,.28); }
  .avatar.user { background:#fff; color:#000; border-radius:50%; font-size:20px; box-shadow:0 2px 7px rgba(0,0,0,.08); }
  .bubble { max-width:70%; background:#fff; border-radius:4px 15px 15px 15px; padding:12px 15px; margin-left:8px; box-shadow:0 1px 6px rgba(15,23,42,.05); }
  .msg-row.user .bubble { background:linear-gradient(135deg,#10b981,#059669); border-radius:15px 4px 15px 15px; margin-left:0; margin-right:8px; box-shadow:0 2px 8px rgba(16,185,129,.3); }
  .msg-row.user .msg-text { color:#fff; }
  .msg-text { font-size:14px; line-height:1.65; word-break:break-all; color:#1f2937; }
  .sug { margin:4px 0 0 46px; }
  .sug-title { font-size:12px; color:#9ca3af; margin-bottom:10px; }
  .sug-grid { display:flex; flex-wrap:wrap; justify-content:space-between; }
  .sug-item { width:48.5%; background:#fff; border-radius:11px; padding:12px 12px; margin-bottom:8px; box-shadow:0 1px 6px rgba(15,23,42,.05); display:flex; align-items:flex-start; }
  .sug-icon { font-size:18px; margin-right:8px; }
  .sug-text { font-size:12px; color:#1f2937; line-height:1.5; }
  .typing { display:flex; align-items:center; padding:3px 2px; }
  .dot { width:7px; height:7px; border-radius:50%; background:#10b981; opacity:.35; margin-right:6px; animation:bounce 1.2s infinite ease-in-out; }
  .dot.d2 { animation-delay:.15s; } .dot.d3 { animation-delay:.3s; margin-right:0; }
  @keyframes bounce { 0%,60%,100%{transform:translateY(0);opacity:.35} 30%{transform:translateY(-4px);opacity:1} }
  .input-bar { display:flex; align-items:center; padding:9px 14px; background:#fff; border-top:1px solid #e5e7eb; box-shadow:0 -2px 12px rgba(15,23,42,.05); }
  .chat-input { flex:1; background:#f5f6f8; border-radius:99px; padding:10px 17px; font-size:14px; color:#9ca3af; }
  .send-btn { margin-left:11px; width:42px; height:42px; border-radius:50%; background:linear-gradient(135deg,#10b981,#059669); color:#fff; font-size:20px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:0 2px 8px rgba(16,185,129,.35); }
  .label { position:absolute; top:-34px; left:0; color:#94a3b8; font-size:13px; }
</style>
</head>
<body>
  <div class="phone">
    <div class="label">AI 教练页 · 新样式预览（打字动画为实时效果）</div>
    <div class="statusbar"><span>00:42</span><span>5G ▮▮▮</span></div>
    <div class="hero">
      <div class="hero-row">
        <div class="hero-avatar">💪</div>
        <div class="hero-info">
          <div class="hero-name">AI 教练</div>
          <div class="hero-status"><span class="status-dot"></span>在线 · 已了解你的身体档案</div>
        </div>
      </div>
    </div>
    <div class="msg-list">
      <div class="msg-row">
        <div class="avatar">AI</div>
        <div class="bubble"><div class="msg-text">你好，我是你的专属 AI 健身教练 💪<br>已读取你的身体档案，训练、饮食、恢复都可以直接问。</div></div>
      </div>
      <div class="msg-row user">
        <div class="bubble"><div class="msg-text">我该怎么安排这周的训练？</div></div>
        <div class="avatar user">😊</div>
      </div>
      <div class="msg-row">
        <div class="avatar">AI</div>
        <div class="bubble"><div class="typing"><div class="dot"></div><div class="dot d2"></div><div class="dot d3"></div></div></div>
      </div>
      <div class="sug">
        <div class="sug-title">试试这样问我</div>
        <div class="sug-grid">
          <div class="sug-item"><span class="sug-icon">🥗</span><span class="sug-text">增肌每天要吃多少蛋白质？</span></div>
          <div class="sug-item"><span class="sug-icon">🦵</span><span class="sug-text">深蹲膝盖不舒服怎么办？</span></div>
          <div class="sug-item"><span class="sug-icon">🏠</span><span class="sug-text">没器械在家怎么练背？</span></div>
          <div class="sug-item"><span class="sug-icon">📋</span><span class="sug-text">这周的训练怎么安排？</span></div>
        </div>
      </div>
    </div>
    <div class="input-bar">
      <div class="chat-input">问我任何训练 / 饮食问题…</div>
      <div class="send-btn">↑</div>
    </div>
  </div>
</body>
</html>
